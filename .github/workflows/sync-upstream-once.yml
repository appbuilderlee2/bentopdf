name: One-time upstream sync

on:
  push:
    paths:
      - ".github/workflows/sync-upstream-once.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run upstream sync
        run: bash scripts/sync-upstream-once.sh
